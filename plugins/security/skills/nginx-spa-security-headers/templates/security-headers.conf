# Security headers for <app>'s static pages. Include in every location that serves the SPA or its
# assets: nginx drops server-level add_header lines in any location that sets its own.
# Don't include it where a backend already sends its own CSP (two CSP headers both apply).
#
# CSP evidence (fill in; keep this up to date when hosts change):
#   script-src  build audit: no inline scripts, no eval
#   img-src     <host>: <why, e.g. CMS image CDN>
#   connect-src <host>: <why, e.g. presigned S3 uploads>
#   font-src    fonts bundled with the build
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
# Older browsers that ignore frame-ancestors.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# Only over HTTPS; browsers ignore it on plain HTTP. See SKILL.md before adding includeSubDomains on an apex domain.
add_header Strict-Transport-Security "max-age=31536000" always;
