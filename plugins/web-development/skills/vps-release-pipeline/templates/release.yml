name: Release

on:
  release:
    types: [published]
  # Manual run: redeploy an existing tag, e.g. to roll back.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (e.g. v1.4.0)
        required: true

permissions:
  contents: read

# One production deploy at a time. A second release waits for the first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  APP_DIR: <app-dir> # e.g. /opt/node/example.com

jobs:
  # Same checks as pr-checks.yml, on the exact tag being deployed.
  check:
    name: Check before deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present
      - run: npm run lint --workspaces --if-present
      - run: npm test --workspaces --if-present
      - run: npm run build --workspaces --if-present

  deploy-app:
    name: Deploy app
    needs: check
    runs-on: ubuntu-latest
    # Optional: create a "production" environment with required reviewers to approve each deploy.
    environment: production
    steps:
      - name: Validate tag
        run: '[[ "$TAG" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid tag: $TAG"; exit 1; }'

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      # The server checks out the same tag the check job tested, then runs update.sh from it.
      - name: Deploy
        run: |
          ssh -p "${{ vars.SSH_PORT }}" "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" \
            "set -e; cd '$APP_DIR' && git fetch --tags --force origin && git checkout --detach 'refs/tags/$TAG' && bash scripts/update.sh"

      - name: Clean up
        if: always()
        run: rm -rf ~/.ssh

  # Delete this job if the repo has no Cloudflare Worker app.
  deploy-worker:
    name: Deploy Worker
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: wrangler deploy
        run: npm exec --workspace <apps/mcp-server> -- wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
