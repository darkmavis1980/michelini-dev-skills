# Sample nginx config for a static SPA + Express API on one host.
#
# Build the static apps first (scripts/update.sh does this), then point each `root` at
# the build output. The API runs under PM2 on 127.0.0.1:3001.
# TLS: add `listen 443 ssl` + certificates (e.g. certbot --nginx), and redirect port 80 to https.
# Security headers: include the snippet from the security:nginx-spa-security-headers skill
# in every static location.

# One canonical host: www redirects to the apex.
server {
    listen 80;
    server_name www.<domain>;
    return 301 https://<domain>$request_uri;
}

server {
    listen 80;
    server_name <domain>;

    root <app-dir>/apps/client/dist;
    index index.html;

    # Size for the largest upload route. Express still enforces per-route limits.
    client_max_body_size 25m;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed build assets: a missing chunk (stale tab after a deploy) is a real 404,
    # never index.html served as JavaScript.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Other files with an extension: real 404 when missing.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    # SPA routes fall back to the shell. index.html must not be cached long.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

# Admin SPA on its own subdomain: same pattern, kept out of search engines.
server {
    listen 80;
    server_name admin.<domain>;

    root <app-dir>/apps/admin/dist;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 26m;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
