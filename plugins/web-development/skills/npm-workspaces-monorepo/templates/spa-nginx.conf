# apps/<app>/nginx.conf, used only inside the Docker image. Production nginx is
# nginx.sample.conf at the repo root.

# Access log without client IPs or query strings.
log_format anonymized '[$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent ${request_time}s';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log anonymized;

    # Admin apps only:
    # add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        proxy_pass http://server:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
