# Location blocks for serving pages as HTML or Markdown from static files.
# Needs the maps in nginx-accept-map.conf (http context): $representation, $markdown_file.
# Pick variant A or B for `location /`, and keep the blocks above it in this order.
# Every add_header in a location replaces the server-level ones: include your security-headers
# snippet in each of these locations (see security:nginx-spa-security-headers).

# Hashed build output. ^~ stops the extension rule below from taking over.
location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location = /llms.txt {
    types { }
    default_type "text/markdown; charset=utf-8";
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# Markdown pages asked for by name (/help.md). Must come before the extension rule below.
# noindex keeps them out of search results as duplicates of the HTML pages.
location ~ \.md$ {
    types { }
    default_type "text/markdown; charset=utf-8";
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex";
    try_files $uri =404;
}

# Other files: a missing one is a real 404, never the HTML shell. Agents and crawlers probing
# /robots.txt, /.well-known/..., /ai-catalog.json would otherwise get HTML with a 200.
location ~ \.[A-Za-z0-9]+$ {
    try_files $uri =404;
}

# ---- Variant A: client-rendered SPA (every route is the same index.html shell) -------------
location / {
    # Only HTML (the shell) and .md files are served from here; mime.types has no .md.
    types {
        text/html html;
        text/markdown md;
    }
    default_type text/plain;
    charset utf-8;
    charset_types text/markdown; # text/html is always included
    add_header Cache-Control "no-cache" always;
    add_header Vary Accept always;
    if ($representation = none) {
        return 406 "406 Not Acceptable: pages are available as text/html or text/markdown.\n";
    }
    # $markdown_file is "" unless Markdown was negotiated; when the .md file doesn't exist the
    # request falls through to the HTML. No $uri/: a dist/blog/ folder of .md files would
    # otherwise turn /blog into a redirect. index.html isn't last, so it's served here with
    # these headers, not redirected to the extension rule above.
    try_files $markdown_file $uri /index.html =404;
}

