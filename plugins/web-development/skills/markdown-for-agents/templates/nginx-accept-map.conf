# Content negotiation for pages: HTML, or the page's Markdown (/ -> /index.md, /x -> /x.md),
# by the Accept header's q-values. Include this file in the nginx `http` context (map is not
# allowed inside `server`), e.g. `include /etc/nginx/snippets/accept-markdown-map.conf;`.
#
# Rules:
#   - text/markdown counts only when listed by name: */* alone means HTML.
#   - HTML's q is text/html, else text/*, else */* (most specific wins, RFC 9110).
#   - No Accept header means anything (HTML).
#   - Markdown wins ties, since only agents list it. Neither acceptable -> "none" (406).
# Known limit (accepted): q-values are compared to their first decimal only, so 0.85 vs 0.8
# is a tie. Clients don't send values that fine in practice. No njs needed.
#
# Source: michelini.dev docker/nginx.conf (ADRs 0009, 0010), also used by homebattery.ie.

# q of text/markdown, only when listed by name ("" when not listed): */* alone means HTML.
map $http_accept $accept_markdown_q {
  default "";
  "~*(^|,)\s*text/markdown\s*;[^,]*\bq\s*=\s*(?<mdq>[0-9.]+)" $mdq;
  "~*(^|,)\s*text/markdown\s*(;|,|$)" 1;
}
# q of HTML: text/html, else text/*, else */* (most specific wins, RFC 9110).
# No Accept header means anything; "" means HTML isn't acceptable.
map $http_accept $accept_html_q {
  default "";
  "" 1;
  "~*(^|,)\s*text/html\s*;[^,]*\bq\s*=\s*(?<htmlq>[0-9.]+)" $htmlq;
  "~*(^|,)\s*text/html\s*(;|,|$)" 1;
  "~*(^|,)\s*text/\*\s*;[^,]*\bq\s*=\s*(?<textq>[0-9.]+)" $textq;
  "~*(^|,)\s*text/\*\s*(;|,|$)" 1;
  "~*(^|,)\s*\*/\*\s*;[^,]*\bq\s*=\s*(?<anyq>[0-9.]+)" $anyq;
  "~*(^|,)\s*\*/\*\s*(;|,|$)" 1;
}
# md, html or none (406). Markdown wins ties: only agents list it.
# q-values are compared to their first decimal, which is all clients use in practice.
map "$accept_markdown_q:$accept_html_q" $representation {
  default html;
  "~^(0(\.0*)?)?:(0(\.0*)?)?$" none;
  "~^(0(\.0*)?)?:" html;
  "~^[^:]+:(0(\.0*)?)?$" md;
  "~^1(\.0*)?:" md;
  "~^0\.[0-9]*:1(\.0*)?$" html;
  "~^0\.(\d)\d*:0\.\1" md;
  "~^0\.9\d*:0\.[0-8]" md;
  "~^0\.8\d*:0\.[0-7]" md;
  "~^0\.7\d*:0\.[0-6]" md;
  "~^0\.6\d*:0\.[0-5]" md;
  "~^0\.5\d*:0\.[0-4]" md;
  "~^0\.4\d*:0\.[0-3]" md;
  "~^0\.3\d*:0\.[0-2]" md;
  "~^0\.2\d*:0\.[01]" md;
  "~^0\.1\d*:0\.0" md;
}
map "$representation:$uri" $markdown_file {
  default "";
  "md:/" /index.md;
  "~^md:(?<page>/.*[^/])/?$" $page.md;
}
